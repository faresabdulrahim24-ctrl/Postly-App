<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./HomeStyle.css">
    <link rel="stylesheet" href="./postDetailsStyle.css">
    <title>Post Details</title>
</head>

<body>

    <!-- navbar start -->
    <div id="main-nav" class="d-flex justify-content-center mt-4 sticky-top w-100"
        style="transition: top 0.4s ease-in-out; top: 0px; z-index: 1030;">
        <div class="col-11 col-md-10 col-lg-8">
            <div class="custom-navbar">

                <div class="nav-group">
                    <a href="#" class="nav-item brand-item">
                        <i class="bi bi-fire text-danger"></i>
                        <span class="nav-text text-permanent">Faresbook</span>
                    </a>
                    <a href="Home.html" class="nav-item">
                        <i class="bi bi-house-door-fill"></i>
                        <span class="nav-text">Home</span>
                    </a>
                    <a href="#" class="nav-item" id="profile-btn">
                        <i class="bi bi-person-fill"></i>
                        <span class="nav-text">Profile</span>
                    </a>
                </div>

                <!-- for non-logged in user -->
                <div class="nav-group">
                    <a href="#" id="login-btn" class="nav-item" data-bs-toggle="modal" data-bs-target="#login-modal">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span class="nav-text">Login</span>
                    </a>
                    <a href="#" id="register-btn" class="nav-item" data-bs-toggle="modal" data-bs-target="#register-modal">
                        <i class="bi bi-person-plus-fill"></i>
                        <span class="nav-text">Register</span>
                    </a>
                </div>

                <!-- logged in user -->
                <div class="nav-group" id="logged-in-div" style="display: none;">
                    <div class="user-profile-badge d-flex align-items-center pe-3 ps-1 py-1">
                        <img id="nav-user-image" src="./profile-pics/1.png" alt="Profile"
                            class="rounded-circle border border-2 border-secondary custom-profile-pic">
                        <b id="logged-in-username" class="custom-username-text">@User_Name</b>
                    </div>
                    <a href="#" id="logout-btn" class="nav-item custom-logout-btn" onclick="logoutBtnClicked()">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="nav-text">Logout</span>
                    </a>
                </div>

            </div>
        </div>
    </div>
    <!-- navbar end -->

    <!-- main content -->
    <div class="container">

        <!-- page title -->
        <div class="d-flex justify-content-center mt-5 mb-4">
            <div class="col-11 col-md-10 col-lg-8 d-flex align-items-center">
                <a href="Home.html" class="btn text-light me-3 custom-back-btn">
                    <i class="bi bi-arrow-left fs-5"></i>
                </a>
                <h2 class="mb-0 custom-page-title">
                    <span id="username-span">...</span> Post
                </h2>
            </div>
        </div>

        <!-- post loaded dynamically here -->
        <div class="d-flex justify-content-center mt-4">
            <div class="col-11 col-md-10 col-lg-8" id="post">
                <!-- loaded dynamically -->
            </div>
        </div>

    </div>
    <!-- main content end -->

    <!-- login modal -->
    <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Login</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="col-form-label">Username:</label>
                        <input type="text" class="form-control" id="username">
                    </div>
                    <div class="mb-3">
                        <label class="col-form-label">Password:</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-success" onclick="loginBtnClicked()">Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- register modal -->
    <div class="modal fade" id="register-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Register A New User</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="col-form-label">Name:</label>
                        <input type="text" class="form-control" id="register-name-input">
                    </div>
                    <div class="mb-3">
                        <label class="col-form-label">Username:</label>
                        <input type="text" class="form-control" id="register-username-input">
                    </div>
                    <div class="mb-3">
                        <label class="col-form-label">Email:</label>
                        <input type="email" class="form-control" id="register-email-input">
                    </div>
                    <div class="mb-3">
                        <label class="col-form-label">Password:</label>
                        <input type="password" class="form-control" id="register-password-input">
                    </div>
                    <div class="mb-3">
                        <label class="col-form-label">Image:</label>
                        <input type="file" class="form-control" id="register-image-input">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-success" onclick="registerBtnClicked()">Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- alerts -->
    <div id="success-alert" class="fade show"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>
    <script src="./mainLogic.js"></script>
    <script src="./postDetailsScript.js"></script>
</body>
</html>
