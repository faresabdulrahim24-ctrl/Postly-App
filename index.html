<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="./homeStyle.css">
    <link rel="icon" type="image/png" href="./favicon.png">

    <title>Home Page</title>
</head>

<body>

    <div id="loader-overlay">
        <div class="lds-ellipsis" style="color: #0d6efd;"><div></div><div></div><div></div><div></div></div>
    </div>

    <!-- Modals -->
    <!-- login modal -->
    <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="recipient-name" class="col-form-label">Email or Username:</label>
                            <input type="text" class="form-control" id="username">
                        </div>
                        <div class="mb-3">
                            <label for="message-text" class="col-form-label">Password:</label>
                            <input type="password" class="form-control" id="password">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light"
                        data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-success" onclick="loginBtnClicked()">Login</button>
                </div>
            </div>
        </div>
    </div>
    <!-- //login modal -->

    <!-- register modal -->
    <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Register A New User</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="col-form-label">Name:</label>
                            <input type="text" class="form-control" id="register-name-input">
                        </div>
                        <div class="mb-3">
                            <label for="username" class="col-form-label">Username:</label>
                            <input type="text" class="form-control" id="register-username-input">
                        </div>
                        <!-- <div class="mb-3">
                            <label for="email" class="col-form-label">Email:</label>
                            <input type="email" class="form-control" id="register-email-input">
                        </div> -->
                        <div class="mb-3">
                            <label for="password" class="col-form-label">Password:</label>
                            <input type="password" class="form-control" id="register-password-input">
                        </div>
                        <div class="mb-3">`
                            <label for="register-image-input" class="col-form-label">Image:</label>
                            <input type="file" class="form-control" id="register-image-input">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light"
                        data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-success"
                        onclick="registerBtnClicked()">Register</button>
                </div>
            </div>
        </div>
    </div>
    <!-- //register modal -->

    <!-- add post modal -->
    <div class="modal fade" id="add-post-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addPostModalTitle">Create A New Post</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="recipient-name" class="col-form-label">Post Header:</label>
                            <input type="text" class="form-control" id="post-header-input">
                            <input type="hidden" id="post-id" value="">
                        </div>
                        <div class="mb-3">
                            <label for="message-text" class="col-form-label">Post Content:</label>
                            <textarea class="form-control custom-textarea" id="post-content-input"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="post-image-url" class="col-form-label">Image:</label>
                            <input type="file" class="form-control" id="post-image-input">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light"
                        data-bs-dismiss="modal">Close</button>
                    <button id="post-modal-submit-btn" type="button" class="btn btn-outline-success" onclick="createPostBtnClicked()">Create Post</button>
                </div>
            </div>
        </div>
    </div>
    <!-- //add post modal -->

    <!-- delete post modal -->
    <div class="modal fade" id="delete-post-modal" tabindex="-1" aria-labelledby="deletePostModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header border-bottom border-secondary border-opacity-50">
                    <h1 class="modal-title fs-5 text-white" id="deletePostModalLabel">
                        <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Delete Post
                    </h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-white" style="font-size: 16px;">
                    Are you sure you want to delete this post? This action cannot be undone.
                    <input type="hidden" id="delete-post-id" value="">
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-50">
                    <button type="button" class="btn btn-outline-secondary text-light"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDeletePost()">Yes, Delete</button>
                </div>
            </div>
        </div>
    </div>
    <!-- //delete post modal -->

    <!-- //modals -->

    <!-- alerts -->
    <div id="success-alert" class="fade show"></div>
    <!-- alerts -->

    <!-- navbar start-->
    <div id="main-nav" class="d-flex justify-content-center mt-4 sticky-top w-100"
        style="transition: top 0.4s ease-in-out; top: 0px; z-index: 1030;">
        <div class="col-11 col-md-10 col-lg-8">
            <div class="custom-navbar">

                <div class="nav-group">
                    <a href="index.html" class="nav-item brand-item">
                        <img src="./favicon.png" alt="Logo" style="height: 28px; width: 28px; object-fit: cover; border-radius: 8px;">
                        <span class="nav-text text-permanent ms-2">Postly</span>
                    </a>

                    <a href="index.html" class="nav-item active">
                        <i class="bi bi-house-door-fill"></i>
                        <span class="nav-text">Home</span>
                    </a>

                    <a href="Profile.html" class="nav-item" id="profile-btn">
                        <i class="bi bi-person-fill"></i>
                        <span class="nav-text">Profile</span>
                    </a>
                </div>

                <!-- for non-logged in user -->
                <div class="nav-group">
                    <a href="#" id="login-btn" class="nav-item" data-bs-toggle="modal" data-bs-target="#login-modal">
                        <i class="bi bi-box-arrow-in-right"></i> <span class="nav-text">Login</span>
                    </a>

                    <a href="#" id="register-btn" class="nav-item" data-bs-toggle="modal"
                        data-bs-target="#register-modal">
                        <i class="bi bi-person-plus-fill"></i><span class="nav-text">Register</span>
                    </a>
                </div>
                <!-- //for non-logged in user -->

                <!-- logged in user -->
                <div class="nav-group" id="logged-in-div" style="display: none;">
                    <div class="user-profile-badge d-flex align-items-center pe-3 ps-1 py-1">
                        <img id="nav-user-image" src="./profile-pics/1.png" alt="Profile"
                            class="rounded-circle border border-2 border-secondary custom-profile-pic">
                        <b id="logged-in-username" class="custom-username-text">
                            User Name
                        </b>
                    </div>
                    <a href="#" id="logout-btn" class="nav-item custom-logout-btn" onclick="logoutBtnClicked()">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="nav-text">Logout</span>
                    </a>
                </div>
                <!-- //logged in user -->

            </div>
        </div>
    </div>
    <!--navbar end -->

    <!--main content-->
    <div class="container">
        <!-- Posts will be displayed here -->
        <div class="d-flex justify-content-center mt-5">
            <div class="col-12 col-md-8 col-lg-6">
                <div id="posts">

                    <!-- post end -->

                </div>
                <!-- main content end -->

                <!-- image modal -->
                <div class="modal fade" id="image-viewer-modal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content bg-transparent border-0 shadow-none">
                            <div class="modal-header border-0">
                                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"
                                    aria-label="Close"
                                    style="background-color: rgba(0,0,0,0.5); border-radius: 50%; padding: 10px;"></button>
                            </div>
                            <div class="modal-body text-center p-0">

                    </div>

                <!-- image modal -->

                <!-- add post button -->
                <button id="add-btn" class="btn custom-add-btn position-fixed" onclick="addBtnClicked()">
                    <i class="bi bi-pencil-square me-2"></i> Add Post
                </button>

</body>
